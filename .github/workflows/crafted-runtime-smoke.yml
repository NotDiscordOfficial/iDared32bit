name: Crafted private runtime smoke tests

# Optional. To enable, set CRAFTED_SMOKE_ENABLED=true as an Actions variable
# and CRAFTED_VAULT_READ_TOKEN as a secret. The token needs Contents:read
# only on the PRIVATE NotDiscordOfficial/CraftedTestVault repository.
# That private repo should have a release tagged crafted-fixtures-v1 whose
# assets are the two distinct, unmodified Crafted IPA files (1.0.1 and 1.0.2).
# Legacy fallback: CRAFTED_TEST_ARCHIVE_URL secret for a private ZIP of IPAs.
# No IPA is committed, written to the public repository, or uploaded as an artifact.
on:
  push:
    branches: [idared32bit]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: crafted-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  crafted-runtime:
    if: ${{ vars.CRAFTED_SMOKE_ENABLED == 'true' }}
    runs-on: macos-15
    timeout-minutes: 90
    env:
      CRAFTED_TEST_ARCHIVE_URL: ${{ secrets.CRAFTED_TEST_ARCHIVE_URL }}
      CRAFTED_TEST_ARCHIVE_SHA256: ${{ secrets.CRAFTED_TEST_ARCHIVE_SHA256 }}
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out emulator and SDL submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install compatible CMake
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 \
            "https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-macos-universal.tar.gz" \
            -o "$RUNNER_TEMP/cmake.tar.gz"
          mkdir -p "$RUNNER_TEMP/cmake-install"
          tar -xzf "$RUNNER_TEMP/cmake.tar.gz" -C "$RUNNER_TEMP/cmake-install"
          cmake_bin="$RUNNER_TEMP/cmake-install/cmake-3.31.6-macos-universal/CMake.app/Contents/bin"
          echo "$cmake_bin" >> "$GITHUB_PATH"
          echo "CMAKE=$cmake_bin/cmake" >> "$GITHUB_ENV"

      - name: Build macOS desktop emulator
        run: cargo build --release --bin touchHLE

      - name: Fetch private, unmodified test games
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.CRAFTED_VAULT_READ_TOKEN }}
          CRAFTED_TEST_VAULT_REPO: ${{ vars.CRAFTED_TEST_VAULT_REPO || 'NotDiscordOfficial/CraftedTestVault' }}
          CRAFTED_TEST_ARCHIVE_URL: ${{ secrets.CRAFTED_TEST_ARCHIVE_URL }}
          CRAFTED_TEST_ARCHIVE_SHA256: ${{ secrets.CRAFTED_TEST_ARCHIVE_SHA256 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/crafted-games"
          if [ -n "$GH_TOKEN" ]; then
            echo "Downloading guest test inputs from private GitHub release."
            gh release download crafted-fixtures-v1 \
              --repo "$CRAFTED_TEST_VAULT_REPO" \
              --pattern '*.ipa' \
              --dir "$RUNNER_TEMP/crafted-games"
          elif [ -n "$CRAFTED_TEST_ARCHIVE_URL" ]; then
            echo "Downloading guest test inputs from private archive."
            case "$CRAFTED_TEST_ARCHIVE_URL" in
              https://*) ;;
              *) echo "::error::Private archive URL must use HTTPS."; exit 1 ;;
            esac
            curl --fail --silent --show-error --location --retry 3 \
              --proto '=https' --proto-redir '=https' --max-time 180 \
              --output "$RUNNER_TEMP/crafted-games.zip" "$CRAFTED_TEST_ARCHIVE_URL"
            if [ -n "$CRAFTED_TEST_ARCHIVE_SHA256" ]; then
              printf '%s  %s\n' "$CRAFTED_TEST_ARCHIVE_SHA256" "$RUNNER_TEMP/crafted-games.zip" | shasum -a 256 -c -
            fi
            unzip -q "$RUNNER_TEMP/crafted-games.zip" -d "$RUNNER_TEMP/crafted-games"
          else
            echo "::error::Set CRAFTED_VAULT_READ_TOKEN for your private release asset vault."
            exit 1
          fi

          # Whitelist the two distinct original, unmodified user-supplied IPAs.
          # The 'cracked' and 'decrypted' 1.0.1 files are identical.
          python3 - <<'PY'
          from collections import Counter
          import hashlib
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "crafted-games"
          ipas = sorted(f for f in root.rglob("*") if f.is_file() and f.suffix.lower() == ".ipa")
          expected = Counter({
              "d0468e7dba522fd0cc6583c73128d09ffd489c595bdf4eedcf6fec448dbbb9e3": 1,
              "293721b87e9f8b5d421cc3345d51d68cd79d42fa0c37296bfe13596615929bfa": 1,
          })
          actual = Counter()
          for ipa in ipas:
              digest = hashlib.sha256()
              with ipa.open("rb") as source:
                  for chunk in iter(lambda: source.read(1024 * 1024), b""):
                      digest.update(chunk)
              actual[digest.hexdigest()] += 1
          if actual != expected:
              raise SystemExit("Private test fixtures do not match the two distinct original IPA checksums.")
          print("Verified two unchanged private IPA inputs by SHA-256.")
          PY

      - name: Exercise the desktop emulator with each guest IPA
        shell: bash
        run: |
          python3 .github/scripts/crafted-smoke.py \
            --emulator target/release/touchHLE \
            --games "$RUNNER_TEMP/crafted-games" \
            --logs "$RUNNER_TEMP/crafted-logs" \
            --seconds 30

      - name: Save emulator logs (never the game IPAs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crafted-runtime-logs
          path: ${{ runner.temp }}/crafted-logs/*.log
          if-no-files-found: ignore
          retention-days: 3
