name: Build unsigned iOS IPA

# Opt-in only: macOS iOS builds are expensive and should not run on every push.
# This workflow does not publish a Release.
on:
  workflow_dispatch:

concurrency:
  group: unsigned-ipa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-ios-ipa:
    name: Compile iOS app and package IPA
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - name: Check out source and SDL submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check Xcode and iOS SDK versions
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Install Rust and iOS target
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-ios

      - name: Install compatible CMake 3.31.6
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-macos-universal.tar.gz"
          curl --fail --location --retry 3 "$url" -o "$RUNNER_TEMP/cmake-3.31.6.tar.gz"
          mkdir -p "$RUNNER_TEMP/cmake-install"
          tar -xzf "$RUNNER_TEMP/cmake-3.31.6.tar.gz" -C "$RUNNER_TEMP/cmake-install"
          cmake_bin="$RUNNER_TEMP/cmake-install/cmake-3.31.6-macos-universal/CMake.app/Contents/bin"
          "$cmake_bin/cmake" --version
          echo "$cmake_bin" >> "$GITHUB_PATH"
          echo "CMAKE=$cmake_bin/cmake" >> "$GITHUB_ENV"

      - name: Compile unsigned iOS app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project iphone/iDared32bit.xcodeproj \
            -scheme 'iDared 32bit' \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/Classic32DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            PRODUCT_BUNDLE_IDENTIFIER='com.notdiscordofficial.classic32' \
            INFOPLIST_KEY_CFBundleDisplayName='Classic32 Personal' \
            build

      - name: Package app as IPA
        shell: bash
        run: |
          set -euo pipefail
          products="$RUNNER_TEMP/Classic32DerivedData/Build/Products/Release-iphoneos"
          app="$products/iDared 32bit.app"
          if [ ! -d "$app" ]; then
            echo 'Expected application bundle was not produced:' >&2
            ls -la "$products" >&2 || true
            exit 1
          fi
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          ditto "$app" "$RUNNER_TEMP/ipa/Payload/$(basename "$app")"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/Classic32-unsigned.ipa" Payload)
          unzip -l "$GITHUB_WORKSPACE/Classic32-unsigned.ipa" | head -25

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Classic32-unsigned-IPA
          path: Classic32-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
