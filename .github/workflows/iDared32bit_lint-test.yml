name: Lint, test and Crafted smoke

# Linux preflight always runs first. Private macOS smoke is a dependent job,
# only on trusted runtime-changing pushes or an explicit manual request.
# Full Windows/macOS/Android checks are manually selected, not automatic.
# The expensive unsigned IPA builder remains a separate manual workflow.

on:
  push:
    branches: [ "idared32bit" ]
  pull_request:
    branches: [ "idared32bit" ]
  workflow_dispatch:
    inputs:
      run_crafted_smoke:
        description: 'Run private Crafted runtime smoke on macOS'
        type: boolean
        required: false
        default: false
      run_platform_matrix:
        description: 'Run full Windows/macOS/Android platform checks'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: lint-test-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  preflight-linux:
    name: Format, Clippy, compile and unit test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      smoke_needed: ${{ steps.smoke_scope.outputs.smoke_needed }}
    # SDL2's vendored HIDAPI predates C23 (where false became a keyword).
    # Force a compatible C language mode without changing emulator sources.
    env:
      CFLAGS: -std=gnu11
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Check whether changes require a runtime smoke test
        id: smoke_scope
        if: github.event_name == 'push'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo 'smoke_needed=true' >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE_SHA" "$GITHUB_SHA" | grep -Eq '^(src/|vendor/|Cargo\.toml$|Cargo\.lock$|build\.rs$|\.github/scripts/crafted-smoke\.py$)'; then
            echo 'smoke_needed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'smoke_needed=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add rustfmt clippy
      - name: Install clang-format
        run: sudo apt-get update -qq && sudo apt-get install -y clang-format
      - name: Check formatting
        run: dev-scripts/format.sh --check
      - name: Install compatible CMake 3.31.6
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 \
            "https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-linux-x86_64.tar.gz" \
            -o "$RUNNER_TEMP/cmake.tar.gz"
          mkdir -p "$RUNNER_TEMP/cmake"
          tar -xzf "$RUNNER_TEMP/cmake.tar.gz" -C "$RUNNER_TEMP/cmake" --strip-components=1
          echo "$RUNNER_TEMP/cmake/bin" >> "$GITHUB_PATH"
          echo "CMAKE=$RUNNER_TEMP/cmake/bin/cmake" >> "$GITHUB_ENV"
      - name: Compile emulator on Linux
        run: cargo check --locked --bin touchHLE
      - name: Clippy lint (Linux)
        run: cargo clippy --locked -- --deny warnings
      - name: Rust unit tests
        run: cargo test --locked --lib

  lint-and-test-macos:
    needs: preflight-linux
    if: github.event_name == 'workflow_dispatch' && inputs.run_platform_matrix == true

    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Install clang-format
        run: brew install clang-format
      - name: Check formatting
        run: dev-scripts/format.sh --check
      - name: Try to get cached copy of cmake
        id: cache-cmake
        uses: actions/cache@v4
        with:
          path: vendor/cmake
          key: cmake_3_31_6_macos
      - if: ${{ steps.cache-cmake.outputs.cache-hit != 'true' }}
        name: Download Cmake
        run: curl -L -O "https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-macos-universal.tar.gz"
      - if: ${{ steps.cache-cmake.outputs.cache-hit != 'true' }}
        name: Extract Cmake
        run: tar xzvf "cmake-3.31.6-macos-universal.tar.gz" -C vendor && mv "vendor/cmake-3.31.6-macos-universal/CMake.app/Contents/" vendor/cmake && rm -rf vendor/cmake-3.31.6-macos-universal
      # This is the earliest point at which we can do linting: we don't need
      # LLVM until building tests.
      - name: Lint
        run: dev-scripts/lint.sh
        env:
          CMAKE: ${{ github.workspace }}/vendor/cmake/bin/cmake
      - name: Try to get cached copy of LLVM
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: tests/llvm
          key: llvm_12_0_0_macOS_x64
      - if: ${{ steps.cache-llvm.outputs.cache-hit != 'true' }}
        name: Download LLVM
        run: curl -L -O "https://github.com/llvm/llvm-project/releases/download/llvmorg-12.0.0/clang+llvm-12.0.0-x86_64-apple-darwin.tar.xz"
      - if: ${{ steps.cache-llvm.outputs.cache-hit != 'true' }}
        name: Extract LLVM
        run: tar -xf clang+llvm-12.0.0-x86_64-apple-darwin.tar.xz && mkdir tests/llvm && mv clang+llvm-12.0.0-x86_64-apple-darwin/* tests/llvm
      - name: Get copy of common-3.0-sdk
        run: cd ${{ github.workspace }}/tests && curl -L https://github.com/touchHLE/common-3.0-sdk/releases/latest/download/common-3.0.sdk-macOS-universal.tar.gz | tar xzv
      - name: Install x86_64 toolchain
        run: rustup target add x86_64-apple-darwin
      - name: Test
        run: cargo test --target x86_64-apple-darwin
        env:
          CMAKE: ${{ github.workspace }}/vendor/cmake/bin/cmake
      # This step ensures that our non-iOS-specific tests are passing on macOS itself!
      - name: Sanity check tests
        run: cc tests/TestApp_source/cli_tests.m tests/TestApp_source/CGAffineTransform.c tests/TestApp_source/SyncTester.m tests/TestApp_source/RespondsToSelector.m tests/TestApp_source/CraftedCompat.m tests/TestApp_source/AutoReleasePoolTest.m tests/TestApp_source/Initialize.m -framework CoreFoundation -framework Foundation -framework CoreGraphics -DDEFINE_ME_WHEN_BUILDING_ON_MACOS -DTestApp_cli_tests_main=main -ObjC && ./a.out

  lint-and-test-win:
    needs: preflight-linux
    if: github.event_name == 'workflow_dispatch' && inputs.run_platform_matrix == true

    runs-on: windows-2022

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0
    # Apparently the Windows runner already has clang-format? That's nice.
    - name: Check formatting
      shell: bash # no command output without this
      run: dev-scripts/format.sh --check
    - name: Try to get cached copy of cmake
      id: cache-cmake
      uses: actions/cache@v4
      with:
        path: vendor/cmake
        key: cmake_3_31_6_windows
    - if: ${{ steps.cache-cmake.outputs.cache-hit != 'true' }}
      name: Download Cmake
      run: curl -L -O "https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-windows-x86_64.zip"
    - if: ${{ steps.cache-cmake.outputs.cache-hit != 'true' }}
      name: Extract Cmake
      run: 7z -ovendor x "cmake-3.31.6-windows-x86_64.zip" && ren vendor\cmake-3.31.6-windows-x86_64 cmake
    # This is the earliest point at which we can do linting: we don't need
    # LLVM until building tests.
    - name: Lint
      shell: bash # no command output without this
      run: dev-scripts/lint.sh
      env:
        CMAKE: ${{ github.workspace }}\vendor\cmake\bin\cmake
    - name: Try to get cached copy of LLVM
      id: cache-llvm
      uses: actions/cache@v4
      with:
        path: tests/llvm
        key: llvm_12_0_1_Windows_x64
    - if: ${{ steps.cache-llvm.outputs.cache-hit != 'true' }}
      name: Download LLVM
      run: curl -L -O "https://github.com/llvm/llvm-project/releases/download/llvmorg-12.0.1/LLVM-12.0.1-win64.exe"
    - if: ${{ steps.cache-llvm.outputs.cache-hit != 'true' }}
      name: Extract LLVM
      run: 7z -otests/llvm x LLVM-12.0.1-win64.exe
    # Windows seems to break the stdout pipe for some reason
    - name: Get copy of common-3.0-sdk
      run: cd ${{ github.workspace }}/tests && curl -L --output ${{ runner.temp }}\sdk.tar.gz https://github.com/touchHLE/common-3.0-sdk/releases/latest/download/common-3.0.sdk-windows-x86_64.tar.gz && tar xzvf ${{ runner.temp }}\sdk.tar.gz
    - name: Test
      run: cargo test
      env:
        CMAKE: ${{ github.workspace }}\vendor\cmake\bin\cmake

  lint-android:
    needs: preflight-linux
    if: github.event_name == 'workflow_dispatch' && inputs.run_platform_matrix == true

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0
    - name: Check formatting
      run: dev-scripts/format.sh --check
    - name: Try to get cached copy of cmake
      id: cache-cmake
      uses: actions/cache@v4
      with:
        path: vendor/cmake
        key: cmake_3_31_6_linux
    - if: ${{ steps.cache-cmake.outputs.cache-hit != 'true' }}
      name: Download Cmake
      run: curl -L -O "https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-linux-x86_64.tar.gz"
    - if: ${{ steps.cache-cmake.outputs.cache-hit != 'true' }}
      name: Extract Cmake
      run: tar xzvf "cmake-3.31.6-linux-x86_64.tar.gz" -C vendor && mv vendor/cmake-3.31.6-linux-x86_64 vendor/cmake
    - name: Install AArch64 Android Rust toolchain
      run: rustup target add aarch64-linux-android
    - name: Install cargo-ndk
      run: cargo install cargo-ndk@3.5.4
    # The version must match the ndkVersion in android/app/build.gradle.kts.
    # The runner image usually has it already.
    - name: Install Android NDK r28c
      run: |
        if [ ! -d "$ANDROID_SDK_ROOT/ndk/28.2.13676358" ]; then
          curl -L -o android-ndk-r28c-linux.zip "https://dl.google.com/android/repository/android-ndk-r28c-linux.zip"
          7z -oandroid-ndk -snld x android-ndk-r28c-linux.zip
          ln -s "$PWD/android-ndk/android-ndk-r28c" "$ANDROID_SDK_ROOT/ndk/28.2.13676358"
        fi
    # Tests can't run on Android, so this is lint-only (clippy cross-compile).
    - name: Lint
      run: dev-scripts/lint.sh ndk -t arm64-v8a
      env:
        # The version should match the ndkVersion defined in `android/app/build.gradle.kts`
        ANDROID_NDK_ROOT: '/usr/local/lib/android/sdk/ndk/28.2.13676358'
        ANDROID_NDK: '/usr/local/lib/android/sdk/ndk/28.2.13676358'
        ANDROID_NDK_HOME: '/usr/local/lib/android/sdk/ndk/28.2.13676358'
        CMAKE: ${{ github.workspace }}/vendor/cmake/bin/cmake

  crafted-runtime:
    name: Private Crafted 1.0.1/1.0.2 smoke (macOS)
    needs: preflight-linux
    # Never expose fixture credentials to pull requests, even from this fork.
    if: >-
      ${{
        vars.CRAFTED_SMOKE_ENABLED == 'true' &&
        (
          (github.event_name == 'push' &&
           github.ref == 'refs/heads/idared32bit' &&
           needs['preflight-linux'].outputs.smoke_needed == 'true' &&
           !contains(github.event.head_commit.message, '[skip crafted smoke]')) ||
          (github.event_name == 'workflow_dispatch' &&
           inputs.run_crafted_smoke == true)
        )
      }}
    runs-on: macos-15
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out emulator and SDL submodules
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: recursive

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install compatible CMake
        shell: bash
        run: |
          set -euo pipefail
          curl -fLsS --retry 3 \
            "https://github.com/Kitware/CMake/releases/download/v3.31.6/cmake-3.31.6-macos-universal.tar.gz" \
            -o "$RUNNER_TEMP/cmake.tar.gz"
          mkdir -p "$RUNNER_TEMP/cmake-install"
          tar -xzf "$RUNNER_TEMP/cmake.tar.gz" -C "$RUNNER_TEMP/cmake-install"
          cmake_bin="$RUNNER_TEMP/cmake-install/cmake-3.31.6-macos-universal/CMake.app/Contents/bin"
          echo "$cmake_bin" >> "$GITHUB_PATH"
          echo "CMAKE=$cmake_bin/cmake" >> "$GITHUB_ENV"

      - name: Build macOS desktop emulator
        run: cargo build --release --bin touchHLE

      - name: Fetch private, unmodified test games
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.CRAFTED_VAULT_READ_TOKEN }}
          CRAFTED_TEST_VAULT_REPO: ${{ vars.CRAFTED_TEST_VAULT_REPO || 'NotDiscordOfficial/CraftedTestVault' }}
          CRAFTED_TEST_ARCHIVE_URL: ${{ secrets.CRAFTED_TEST_ARCHIVE_URL }}
          CRAFTED_TEST_ARCHIVE_SHA256: ${{ secrets.CRAFTED_TEST_ARCHIVE_SHA256 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/crafted-games"
          if [ -n "$GH_TOKEN" ]; then
            echo "Downloading guest test inputs from private GitHub release."
            gh release download crafted-fixtures-v1 \
              --repo "$CRAFTED_TEST_VAULT_REPO" \
              --pattern '*.ipa' \
              --dir "$RUNNER_TEMP/crafted-games"
          elif [ -n "$CRAFTED_TEST_ARCHIVE_URL" ]; then
            echo "Downloading guest test inputs from private archive."
            case "$CRAFTED_TEST_ARCHIVE_URL" in
              https://*) ;;
              *) echo "::error::Private archive URL must use HTTPS."; exit 1 ;;
            esac
            curl --fail --silent --show-error --location --retry 3 \
              --proto '=https' --proto-redir '=https' --max-time 180 \
              --output "$RUNNER_TEMP/crafted-games.zip" "$CRAFTED_TEST_ARCHIVE_URL"
            if [ -n "$CRAFTED_TEST_ARCHIVE_SHA256" ]; then
              printf '%s  %s\n' "$CRAFTED_TEST_ARCHIVE_SHA256" "$RUNNER_TEMP/crafted-games.zip" | shasum -a 256 -c -
            fi
            unzip -q "$RUNNER_TEMP/crafted-games.zip" -d "$RUNNER_TEMP/crafted-games"
          else
            echo "::error::Set CRAFTED_VAULT_READ_TOKEN for your private release asset vault."
            exit 1
          fi

          # Whitelist the two distinct original, unmodified user-supplied IPAs.
          # The 'cracked' and 'decrypted' 1.0.1 files are identical.
          python3 - <<'PY'
          from collections import Counter
          import hashlib
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "crafted-games"
          ipas = sorted(f for f in root.rglob("*") if f.is_file() and f.suffix.lower() == ".ipa")
          expected = Counter({
              "d0468e7dba522fd0cc6583c73128d09ffd489c595bdf4eedcf6fec448dbbb9e3": 1,
              "293721b87e9f8b5d421cc3345d51d68cd79d42fa0c37296bfe13596615929bfa": 1,
          })
          actual = Counter()
          for ipa in ipas:
              digest = hashlib.sha256()
              with ipa.open("rb") as source:
                  for chunk in iter(lambda: source.read(1024 * 1024), b""):
                      digest.update(chunk)
              actual[digest.hexdigest()] += 1
          if actual != expected:
              raise SystemExit("Private test fixtures do not match the two distinct original IPA checksums.")
          print("Verified two unchanged private IPA inputs by SHA-256.")
          PY

      - name: Exercise the desktop emulator with each guest IPA
        shell: bash
        run: |
          python3 .github/scripts/crafted-smoke.py \
            --emulator target/release/touchHLE \
            --games "$RUNNER_TEMP/crafted-games" \
            --logs "$RUNNER_TEMP/crafted-logs" \
            --seconds 30

      - name: Save emulator logs (never the game IPAs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crafted-runtime-logs
          path: ${{ runner.temp }}/crafted-logs/*.log
          if-no-files-found: ignore
          retention-days: 3
